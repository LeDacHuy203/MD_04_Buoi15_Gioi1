server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Route 1: Định tuyến các request /api/courses/** xuống Course-Service (port 8082)
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/courses/**

        # Route 2: Định tuyến các request /api/auth/** xuống Identity-Service (port 8080)
        - id: identity-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/auth/**

jwt:
  # Secret key dùng chung với Identity Service để giải mã JWT
  secret: thien-tay-nhan-809671-363636-676767-identity-service-secret-key-hs256
